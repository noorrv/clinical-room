<!-- Supabase → Authentication → Emails → Templates → "Reset password"
     Subject: Reset your password · The Clinical Room -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#4e6b47;padding:32px 12px;font-family:Georgia,'Times New Roman',serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#f2ebdc;border:1px solid #c9b48c;border-radius:6px;">
        <tr>
          <td style="padding:36px 36px 8px;text-align:center;">
            <p style="margin:0;font-style:italic;font-size:15px;color:#82262a;">The Clinical Room</p>
            <h1 style="margin:6px 0 0;font-size:28px;font-weight:normal;color:#6f1d1b;">Reset your password</h1>
            <p style="margin:12px auto 0;width:120px;border-top:1px solid #82262a;font-size:0;line-height:0;">&nbsp;</p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 36px 8px;font-size:16px;line-height:1.6;color:#3b2416;text-align:center;">
            Someone asked to reset the password for your account.
            Choose a new one with the button below. The link works once and expires soon.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:20px 36px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 30px;background:#6f1d1b;color:#fbf4e4;text-decoration:none;font-size:17px;border-radius:999px;">Choose a new password</a>
          </td>
        </tr>
        <tr>
          <td style="padding:0 36px 32px;font-size:13px;line-height:1.6;color:#6a4a36;text-align:center;font-style:italic;">
            If you didn’t ask for this, you can ignore this email: your password stays the same.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
